name: 📦 Publish @simplafy-tec/ui

on:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # ⚠️ `ubuntu-latest` AQUI É DELIBERADO — NÃO troque por `${{ vars.CI_RUNNER }}`.
    # Exceção documentada do ADR-015 v4, pelo mesmo motivo do `evolution-api`.
    #
    # `simplafy-ui` é um repositório PÚBLICO, e o grupo de runners da org tem
    # `allows_public_repositories: false`. Um job apontado para as VMs
    # self-hosted NUNCA É ATRIBUÍDO: fica `queued` para sempre e não vira
    # vermelho — não existe sinal de erro nenhum.
    #
    # Medido em 2026-09-02 (PR simplafy-ui#20, run 33672287470):
    #
    #   $ gh api /repos/Simplafy-tec/simplafy-ui/actions/runs/33672287470/jobs
    #   {"name":"quality","labels":["simplafy-ci-2"],"status":"queued",
    #    "runner_name":"","runner_group_name":"",
    #    "created_at":"2026-09-02T19:16:16Z"}          <- 205 min em fila
    #
    #   $ gh api /orgs/Simplafy-tec/actions/runner-groups/1
    #   {"name":"Default","visibility":"all","allows_public_repositories":false}
    #
    #   $ gh api /repos/Simplafy-tec/simplafy-ui --jq '[.name,.visibility]'
    #   ["simplafy-ui","public"]
    #
    # Não era falta de slot: um run do Saúde criado 3h DEPOIS (33691275080,
    # 22:37Z) tomou os DOIS slots do ci-2 em menos de 1 minuto.
    #
    # A variável de repositório `CI_RUNNER` deste repo ainda diz `simplafy-ci-2`
    # (gravada em 2026-08-14) e está INERTE — este workflow não a lê. Mudar a
    # variável não conserta nada enquanto o repo for público; o que resolveria é
    # tornar o repo privado, ou abrir as VMs a PR de fork (recusado: a máquina
    # tem credencial e cache de todos os repos).
    #
    # AQUI O ESTRAGO SERIA PIOR QUE NO ci.yml: este job publica o pacote. Com o
    # runner self-hosted, ele nunca seria atribuído e `@simplafy-tec/ui`
    # PARARIA DE PUBLICAR EM SILÊNCIO — run eternamente "em andamento", nunca
    # vermelho. Hub, Saúde e Site deixariam de receber versão nova sem nenhum
    # sinal de erro.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@simplafy-tec'
          # `cache: pnpm` fica — ver ci.yml. O `registry-url` é o que escreve o
          # .npmrc do job com `//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}`.
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Mesmo gate do CI, agora também no caminho que PUBLICA. O CI roda no push
      # para main, mas em job separado: sem esta linha, um token reprovado sairia
      # publicado no pacote enquanto o job vizinho ficava vermelho.
      - run: pnpm test
      - run: pnpm build
      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
