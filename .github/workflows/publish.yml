name: 📦 Publish @simplafy-tec/ui

# Só a tag de versão publica. Com `push` na main junto, todo merge sem bump de
# versão tentava republicar a mesma versão e morria em
# `E409 Cannot publish over existing version` (run 32884155909), e o merge que
# trazia o bump disparava dois publishes do mesmo commit, um deles fadado ao
# 409 (runs 24744428701 e 24744430929, v1.1.1).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # ⚠️ `ubuntu-latest` AQUI É DELIBERADO — NÃO troque por `${{ vars.CI_RUNNER }}`.
    # Exceção documentada do ADR-015 v4, na mesma forma do precedente vivo em
    # `simplafy-infra/.github/workflows/perimeter-scan.yml:4-7,41` (label literal
    # no workflow + comentário dizendo por quê, e "Não trocar por
    # ${{ vars.CI_RUNNER }}" escrito no arquivo). Lá o motivo é outro — o scan
    # precisa enxergar de fora da rede confiável —, mas o formato é este.
    #
    # ⚠️ NÃO use o `evolution-api` como precedente: ele mantém
    # `runs-on: ${{ vars.CI_RUNNER }}` e resolve pela variável de repositório, e
    # a doc de CI ainda manda movê-lo para o `ci-2` — instrução que quebraria
    # aquele repo pelo mesmo motivo descrito abaixo (correção em issue#2548).
    #
    # `simplafy-ui` é um repositório PÚBLICO, e o grupo de runners da org tem
    # `allows_public_repositories: false`. Um job apontado para as VMs
    # self-hosted NUNCA É ATRIBUÍDO: fica `queued` sem dono e termina
    # CANCELADO — nunca vermelho, nunca com mensagem de erro. (O job desta PR
    # foi cancelado à mão depois de 205 min; deixado sozinho, o GitHub encerra
    # por tempo. Nos dois caminhos o resultado é `cancelled`, não `failure`.)
    #
    # Medido em 2026-09-02 (PR simplafy-ui#20, run 33672287470):
    #
    #   $ gh api /repos/Simplafy-tec/simplafy-ui/actions/runs/33672287470/jobs
    #   {"name":"quality","labels":["simplafy-ci-2"],"status":"queued",
    #    "runner_name":"","runner_group_name":"",
    #    "created_at":"2026-09-02T19:16:16Z"}          <- 205 min sem dono
    #   (estado final do mesmo job, conferido depois: "status":"completed",
    #    "conclusion":"cancelled" — `runner_name` vazio é a assinatura de
    #    "nunca atribuído"; não é fila cheia, é recusa)
    #
    #   $ gh api /orgs/Simplafy-tec/actions/runner-groups/1
    #   {"name":"Default","visibility":"all","allows_public_repositories":false}
    #
    #   $ gh api /repos/Simplafy-tec/simplafy-ui --jq '[.name,.visibility]'
    #   ["simplafy-ui","public"]
    #
    # Não era falta de slot: um run do Saúde criado 3h DEPOIS (33691275080,
    # 22:37Z) tomou os DOIS slots do ci-2 em menos de 1 minuto.
    #
    # A variável de repositório `CI_RUNNER` deste repo ainda diz `simplafy-ci-2`
    # (gravada em 2026-08-14) e está INERTE — este workflow não a lê. Mudar a
    # variável não conserta nada enquanto o repo for público; o que resolveria é
    # tornar o repo privado, ou abrir as VMs a PR de fork (recusado: a máquina
    # tem credencial e cache de todos os repos).
    #
    # AQUI O ESTRAGO SERIA PIOR QUE NO ci.yml: este job publica o pacote. Com o
    # runner self-hosted, ele nunca seria atribuído e `@simplafy-tec/ui`
    # PARARIA DE PUBLICAR EM SILÊNCIO — run eternamente "em andamento", nunca
    # vermelho. Hub, Saúde e Site deixariam de receber versão nova sem nenhum
    # sinal de erro.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Só publica commit que já está na main: uma tag pode apontar para commit
      # de branch. Exige o histórico completo (`fetch-depth: 0`) para o
      # merge-base enxergar `origin/main`.
      - name: Ref publicável (commit contido na main)
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA ($GITHUB_REF_NAME) não está na main — publique só o que entrou por PR"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@simplafy-tec'
          # `cache: pnpm` fica — ver ci.yml. O `registry-url` é o que escreve o
          # .npmrc do job com `//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}`.
          cache: pnpm

      # A tag tem de ser a versão do package.json: tag sem bump publicaria por
      # cima de versão existente (E409), e bump sem tag correspondente sairia com
      # o número errado. Falha antes de instalar qualquer coisa.
      - name: Tag confere com a versão do pacote
        run: |
          versao="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$versao" ]; then
            echo "::error::tag $GITHUB_REF_NAME não confere com a versão do package.json ($versao)"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      # Gate dos tokens no caminho que PUBLICA. Fica mesmo com o CI da PR: a main
      # deste repo não tem proteção de branch e já recebeu push direto (deae02c),
      # então nem todo commit tagueado passou pelo CI. Custa segundos
      # (`node --test`, sem dependência extra); lint e typecheck ficam só no CI.
      - run: pnpm test
      - run: pnpm build
      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
