name: 🔍 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ${{ vars.CI_RUNNER }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Contraste dos tokens do Design System
        run: node --test scripts/ci/design-tokens-contrast.test.mjs

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
